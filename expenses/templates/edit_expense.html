
<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #ef4444;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #dc2626;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Edit Expense</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Expense Name</label>
            <input type="text" name="Expensename"
                   value="{{ expense.Expensename }}" required>

            <label>Amount (₹)</label>
            <input type="number" name="amount"
                   value="{{ expense.amount }}"
                   step="0.01" min="0.01" required>

            <label>Date</label>
            <input type="date" name="date"
                   value="{{ expense.date|date:'Y-m-d' }}" required>

            <label>Description</label>
            <textarea name="description">{{ expense.description }}</textarea>

            <button type="submit">Update Expense</button>
        </form>

        <a href="{% url 'transactions' %}" class="back">
            ← Back to Transactions
        </a>

    </div>

</body>
</html>
