
<!DOCTYPE html>
<html>
<head>
    <title>Add Income</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Add Income</h2>
        <p class="subtitle">Enter your income details</p>

        <form method="POST">
            {% csrf_token %}

            <label>Income Source</label>
            <input type="text" name="source"
                   placeholder="e.g. Salary" required>

            <label>Amount (₹)</label>
            <input type="number" name="amount"
                   step="0.01" min="0.01" placeholder="Enter amount" required>

            <label>Date</label>
            <input type="date" name="date" required>

            <label>Description</label>
            <textarea name="description"
                      placeholder="Enter description"></textarea>

            <button type="submit">Save Income</button>
        </form>

        <a href="{% url 'dashboard' %}" class="back">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
